name: Write manifest for Posit Connect (staging)

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

jobs:
  write-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Try 4.3.3 first; if Connect still can’t find 4.3.x, change to '4.2.3' and re-run.
      R_VERSION: '4.3.3'
      # Fast binaries for Ubuntu jammy (ubuntu-latest)
      CRAN_REPO: https://packagemanager.posit.co/cran/__linux__/jammy/latest
      # Prevent renv autoloader from trying to load a specific renv version
      RENV_CONFIG_AUTOLOADER_ENABLED: 'false'

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup R ${{ env.R_VERSION }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Ensure base tools (renv, rsconnect, remotes, yaml, jsonlite)
        run: |
          Rscript - <<'RS'
          repo <- Sys.getenv('CRAN_REPO', 'https://cloud.r-project.org')
          need <- c('renv','rsconnect','remotes','yaml','jsonlite')
          miss <- need[!vapply(need, requireNamespace, logical(1), quietly = TRUE)]
          if (length(miss)) install.packages(miss, repos = repo)
          RS

      # Optional pins to keep deps compatible with R 4.3.x
      - name: Pin packages for R ${{ env.R_VERSION }}
        run: |
          Rscript - <<'RS'
          if (!requireNamespace('renv', quietly = TRUE)) {
            install.packages('renv', repos = Sys.getenv('CRAN_REPO'))
          }
          # Matrix >= 1.7 requires R >= 4.4; pin to last 4.3-compatible
          try(renv::record(list(Matrix = '1.6-5')), silent = TRUE)
          # If CI later fails on others requiring R >= 4.4, add pins here, e.g.:
          # try(renv::record(list(DiagrammeR = '1.0.11', igraph = '1.5.1')), silent = TRUE)
          RS

      - name: Install project dependencies (ignore any lockfile)
        env:
          RENV_CONFIG_IGNORE_LOCKFILE: true
        run: |
          Rscript - <<'RS'
          repo <- Sys.getenv('CRAN_REPO', 'https://cloud.r-project.org')
          if (!requireNamespace('renv', quietly = TRUE)) {
            install.packages('renv', repos = repo)
          }
          if (!requireNamespace('remotes', quietly = TRUE)) {
            install.packages('remotes', repos = repo)
          }
          # Detect app directory (adjust if Primary App Directory is ".")
          appdir <- if (dir.exists('inst/app')) 'inst/app' else '.'

          # Discover dependencies in the app directory
          deps <- renv::dependencies(path = appdir, progress = FALSE)
          pkgs <- unique(na.omit(deps$Package))

          # Install CRAN deps first (exclude base + your own package)
          base <- rownames(installed.packages(priority = 'base'))
          cran_pkgs <- setdiff(pkgs, c(base, 'TMDLDash'))
          if (length(cran_pkgs)) {
            for (p in cran_pkgs) {
              message('Installing ', p, ' ...')
              try(renv::install(p), silent = TRUE)
            }
          }

          # If this repo is an R package named TMDLDash, install it locally
          if (file.exists('DESCRIPTION')) {
            d <- readLines('DESCRIPTION', warn = FALSE)
            if (any(grepl('^Package:\\s*TMDLDash\\b', d))) {
              message('Installing local package TMDLDash ...')
              remotes::install_local('.', upgrade = 'never', dependencies = TRUE)
            }
          }
          RS

      - name: Write manifest into app directory and show R version
        run: |
          Rscript - <<'RS'
          if (!requireNamespace('rsconnect', quietly = TRUE)) {
            install.packages('rsconnect', repos = Sys.getenv('CRAN_REPO', 'https://cloud.r-project.org'))
          }
          if (!requireNamespace('jsonlite', quietly = TRUE)) {
            install.packages('jsonlite', repos = Sys.getenv('CRAN_REPO', 'https://cloud.r-project.org'))
          }
          appdir <- if (dir.exists('inst/app')) 'inst/app' else '.'

          # Temporarily move renv.lock so writeManifest does not parse it
          lf <- file.path(appdir, 'renv.lock')
          if (file.exists(lf)) file.rename(lf, paste0(lf, '.bak'))

          rsconnect::writeManifest(appDir = appdir, force = TRUE)

          man_path <- file.path(appdir, 'manifest.json')
          man <- jsonlite::read_json(man_path, simplifyVector = TRUE)
