name: Write manifest for Posit Connect (staging)

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

jobs:
  write-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Try 4.3.3 first; if Connect still can't find 4.3.x, change to '4.2.3' and re-run.
      R_VERSION: '4.3.3'
      # Fast Linux binaries via Posit Public Package Manager (jammy = ubuntu-latest)
      CRAN_REPO: https://packagemanager.posit.co/cran/__linux__/jammy/latest

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup R ${{ env.R_VERSION }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Install tools (renv, yaml, rsconnect)
        run: |
          Rscript - <<'RS'
          options(repos = c(CRAN = Sys.getenv('CRAN_REPO')))
          install.packages(c('renv','yaml','rsconnect'))
          RS

      # Optional pins to keep packages compatible with R 4.3.x
      - name: Pin versions compatible with R ${{ env.R_VERSION }}
        run: |
          Rscript - <<'RS'
          # Only needed if you hit pkg-requires-R>=4.4 errors:
          try(renv::record(list(renv = '1.2.1')), silent = TRUE)
          try(renv::record(list(Matrix = '1.6-5')), silent = TRUE)  # Matrix >= 1.7 needs R >= 4.4
          # Add more pins here if needed, e.g.:
          # try(renv::record(list(DiagrammeR = '1.0.11', igraph = '1.5.1')), silent = TRUE)
          RS

      - name: Install project dependencies (ignore old lockfile)
        env:
          RENV_CONFIG_IGNORE_LOCKFILE: true
        run: |
          Rscript - <<'RS'
          options(repos = c(CRAN = Sys.getenv('CRAN_REPO')))
          deps <- renv::dependencies(progress = FALSE)
          pkgs <- unique(na.omit(deps$Package))
          base <- rownames(installed.packages(priority = 'base'))
          pkgs <- setdiff(pkgs, c(base, 'TMDLDash'))  # exclude base and your own package if present
          for (p in pkgs) {
            message('Installing ', p, ' ...')
            try(renv::install(p), silent = TRUE)
          }
          RS

      - name: Write manifest into the app directory and show R version
        run: |
          Rscript - <<'RS'
          appdir <- if (dir.exists('inst/app')) 'inst/app' else '.'
          rsconnect::writeManifest(appDir = appdir, force = TRUE)
          man <- jsonlite::read_json(file.path(appdir, 'manifest.json'))
          rv <- man$metadata$rVersion %||% man$r$version %||% 'unknown'
          cat('Manifest R version:', rv, '\n')
          RS

      - name: Commit manifest.json to staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inst/app/manifest.json manifest.json || true
          git commit -m "Add manifest.json generated under R ${{ env.R_VERSION }} (staging)" || echo "No changes to commit"
          git push origin HEAD:staging