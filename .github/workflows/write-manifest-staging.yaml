name: Write manifest for Posit Connect (staging)

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

jobs:
  write-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Try 4.3.3 first; if Connect still can't find 4.3.x, change to '4.2.3' and re-run.
      R_VERSION: '4.3.3'
      # Fast binaries for Ubuntu jammy
      CRAN_REPO: https://packagemanager.posit.co/cran/__linux__/jammy/latest

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup R ${{ env.R_VERSION }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Install tools
        run: |
          Rscript - <<'RS'
          options(repos = c(CRAN = Sys.getenv('CRAN_REPO')))
          install.packages(c('renv','yaml','rsconnect','jsonlite'))
          RS

      # Optional: pin versions compatible with R 4.3.x
      - name: Pin packages for R ${{ env.R_VERSION }}
        run: |
          Rscript - <<'RS'
          # Matrix >= 1.7 requires R >= 4.4; pin to last 4.3-compatible
          try(renv::record(list(Matrix = '1.6-5')), silent = TRUE)
          # Add more pins if CI reports other R>=4.4 requirements, e.g.:
          # try(renv::record(list(DiagrammeR = '1.0.11', igraph = '1.5.1')), silent = TRUE)
          RS

      - name: Install project dependencies (ignore any lockfile)
        env:
          RENV_CONFIG_IGNORE_LOCKFILE: true
        run: |
          Rscript - <<'RS'
          options(repos = c(CRAN = Sys.getenv('CRAN_REPO')))
          deps <- renv::dependencies(progress = FALSE)
          pkgs <- unique(na.omit(deps$Package))
          base <- rownames(installed.packages(priority = 'base'))
          pkgs <- setdiff(pkgs, c(base, 'TMDLDash'))  # exclude base + your own package if present
          for (p in pkgs) {
            message('Installing ', p, ' ...')
            try(renv::install(p), silent = TRUE)
          }
          RS

      - name: Write manifest into app directory and show R version
        run: |
          Rscript - <<'RS'
          appdir <- if (dir.exists('inst/app')) 'inst/app' else '.'

          # Temporarily remove any renv.lock so writeManifest doesn't try to parse it
          lf <- file.path(appdir, 'renv.lock')
          if (file.exists(lf)) file.rename(lf, paste0(lf, '.bak'))

          rsconnect::writeManifest(appDir = appdir, force = TRUE)

          man <- jsonlite::read_json(file.path(appdir, 'manifest.json'))
          rv <- man$metadata$rVersion %||% (man$r$version %||% 'unknown')
          cat('Manifest R version:', rv, '\n')
          RS

      - name: Commit manifest.json to staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inst/app/manifest.json manifest.json || true
          git commit -m "Add manifest.json generated under R ${{ env.R_VERSION }} (staging)" || echo "No changes to commit"
          git push origin HEAD:staging