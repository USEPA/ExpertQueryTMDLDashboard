name: Rebuild renv.lock for Posit Connect (staging)

on:
  push:
    branches: [ staging ]      # auto-run on any push to staging
  workflow_dispatch:            # allow manual runs

jobs:
  rebuild-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Target R; try 4.3.3 first. If Connect still says 4.3.x not found, change to '4.2.3'.
      R_VERSION: '4.3.3'
      # Fast binaries via Posit Public Package Manager (jammy = ubuntu-latest)
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/jammy/latest

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Install renv
        run: Rscript -e "install.packages('renv', repos = Sys.getenv('RENV_CONFIG_REPOS_OVERRIDE'))"

      # Install compatible dependency versions for this R (ignore the old lockfile),
      # then write a fresh renv.lock via snapshot.
      - name: Resolve deps for ${{ env.R_VERSION }} and snapshot
        env:
          RENV_CONFIG_IGNORE_LOCKFILE: true
        run: |
          Rscript -e "deps <- renv::dependencies(progress = FALSE); pkgs <- unique(deps$Package); pkgs <- setdiff(pkgs, c('TMDLDash')); if (length(pkgs)) renv::install(pkgs)"
          Rscript -e "renv::snapshot(prompt = FALSE)"

      - name: Commit lockfile changes back to staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renv.lock renv/settings.dcf || true
          git commit -m "Rebuild renv.lock under R ${{ env.R_VERSION }} (staging)" || echo "No changes to commit"
          git push origin HEAD:staging