name: Rebuild renv.lock for Posit Connect (staging)

on:
  push:
    branches: [ staging ]      # auto-run on any push to staging
  workflow_dispatch:            # allow manual runs

jobs:
  rebuild-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Target R; try 4.3.3 first. If Connect still says 4.3.x not found, change to '4.2.3'.
      R_VERSION: '4.3.3'
      # Fast binaries via Posit Public Package Manager (jammy = ubuntu-latest)
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/jammy/latest

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Install renv and yaml
        run: |
          Rscript -e "install.packages(c('renv','yaml'), repos = Sys.getenv('RENV_CONFIG_REPOS_OVERRIDE'))"

      - name: Pin renv version and Matrix for R ${{ env.R_VERSION }}
        run: |
          Rscript -e "renv::record('renv@1.2.1')"                 # align lockfile with installed renv
          Rscript -e "renv::record(list(Matrix = '1.6-5'))"       # Matrix >= 1.7.x needs R >= 4.4

      # Install project dependencies compatible with this R (ignore old lockfile),
      # install one by one to avoid the vector 'spec' error, then snapshot.
