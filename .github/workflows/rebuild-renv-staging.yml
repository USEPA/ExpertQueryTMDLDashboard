name: Rebuild renv.lock for Posit Connect (staging)

on:
  push:
    branches: [ staging ]      # auto-run on any push to staging
  workflow_dispatch:            # allow manual runs

jobs:
  rebuild-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Target R; try 4.3.3 first. If Connect still says 4.3.x not found, change to '4.2.3'.
      R_VERSION: '4.3.3'
      # Fast binaries via Posit Public Package Manager (jammy = ubuntu-latest)
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/jammy/latest

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Install renv and yaml (using PPM)
        run: |
          Rscript - <<'RS'
          install.packages(c('renv','yaml'), repos = Sys.getenv('RENV_CONFIG_REPOS_OVERRIDE'))
          RS

      - name: Pin renv and Matrix to compatible versions
        run: |
          Rscript - <<'RS'
          # Align lockfile with renv we just installed
          renv::record('renv@1.2.1')
          # Matrix >= 1.7.x requires R >= 4.4; pin to last 4.3-compatible
          renv::record(list(Matrix = '1.6-5'))
          RS

      # Install project dependencies compatible with this R (ignore old lockfile),
      # install one by one to avoid vector-quoting issues, then snapshot a fresh lockfile.
      - name: Resolve deps for ${{ env.R_VERSION }} and snapshot
        env:
          RENV_CONFIG_IGNORE_LOCKFILE: true
        run: |
          Rscript - <<'RS'
          # Ensure renv uses the PPM repo for binaries
          options(repos = c(CRAN = Sys.getenv('RENV_CONFIG_REPOS_OVERRIDE')))
          deps <- renv::dependencies(progress = FALSE)
          pkgs <- unique(na.omit(deps$Package))
          base <- rownames(installed.packages(priority = 'base'))
          pkgs <- setdiff(pkgs, c(base, 'TMDLDash'))  # exclude base and your own pkg if present
          if (length(pkgs)) {
            for (p in pkgs) {
              message('Installing ', p, ' ...')
              tryCatch(
                renv::install(p),
                error = function(e) message('Failed to install ', p, ': ', conditionMessage(e))
              )
            }
          }
          renv::snapshot(prompt = FALSE)
          RS

      - name: Commit lockfile changes back to staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renv.lock renv/settings.dcf || true
          git commit -m "Rebuild renv.lock under R ${{ env.R_VERSION }} (staging)" || echo "No changes to commit"
          git push origin HEAD:staging