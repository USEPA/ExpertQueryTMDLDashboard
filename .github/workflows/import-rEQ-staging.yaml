name: import data staging

on:
  push:
    branches:
      - staging
  schedule:
    - cron: '15 06 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::remotes
            any::dplyr
            any::httr2
            any::usethis
            any::jsonlite
            any::lubridate
            any::devtools

      - name: Install rExpertQuery from GitHub
        run: |
          Rscript -e "remotes::install_github('USEPA/rExpertQuery', ref = 'develop', dependencies = TRUE, auth_token = Sys.getenv('GITHUB_TOKEN'))"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import org data
        run: |
          Rscript scripts/importEQdata.R

      - name: Debug output files
        run: |
          pwd
          ls -la
          ls -la launcher || true
          ls -la launcher/extdata || true
          ls -la launcher/www || true

      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          if git diff --quiet -- launcher/extdata/importEQdata.RData launcher/www/RMD_data.RData; then
            echo "No changes to commit"
            exit 0
          fi

          git add launcher/data/EQ_data.RData
          git add launcher/data/RMD_data.RData
          git commit -m "Data updated"
          git push origin HEAD:${GITHUB_REF_NAME}