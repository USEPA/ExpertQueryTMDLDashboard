# based on https://rfortherestofus.com/2023/05/github-actions
name: import data
on:
  push:
  schedule:
    - cron: '15 06 * * 0' # This runs at 06:15 AM, only on Sunday
permissions: write-all

jobs:
  import-data:
    runs-on: ubuntu-latest

    steps:
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::remotes
            any::dplyr
            any::httr2
            any::usethis
            any::pkgdown
            any::rcmdcheck
            any::rversions
            any::urlchecker
            any::jsonlite
            any::lubridate
            any::devtools
            
      - name: Install package rExpertQuery from GitHub
        run: |
          Rscript -e "remotes::install_github('USEPA/rExpertQuery@develop', dependencies = TRUE, Sys.getenv('GITHUB_PAT'))"
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out repository
        uses: actions/checkout@v3

      - name: Import org data
        run: Rscript -e 'source("inst/app/data/importEQdata.R")'

      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add EQ_data.RData
          git commit -m 'Data updated' || echo "No changes to commit"
          git push origin || echo "No changes to commit"