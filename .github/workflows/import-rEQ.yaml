# based on https://rfortherestofus.com/2023/05/github-actions
name: import data
on:
  push:
  schedule:
    - cron: '15 06 * * 3' # This runs at 06:15 AM, only on Wednesday
permissions: write-all

jobs:
  import-data:
    runs-on: ubuntu-latest
    steps:
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::jsonlite
            any::lubridate
            
      - name: Install remotes
        run: |
          Rscript -e "install.packages('remotes')"
      - name: Install package rExpertQuery from GitHub
        with:
          token:
        run: |
          Rscript -e "remotes::install_github('USEPA/rExpertQuery', dependencies = TRUE)"

      - name: Check out repository
        uses: actions/checkout@v3

      - name: Import org data
        run: Rscript -e 'source("R/ImportEQdata.R")'

      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add EQ_data.RData
          git commit -m 'Data updated' || echo "No changes to commit"
          git push origin || echo "No changes to commit"