name: render-rmarkdown-staging

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["import data staging"]
    types:
      - completed

permissions:
  contents: write

jobs:
  render-rmarkdown:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            pkg-config

      - name: Install R packages
        run: |
          Rscript - <<'RS'
          options(repos = c(CRAN = "https://cloud.r-project.org"))

          pkgs <- c("rmarkdown", "knitr", "dplyr", "DiagrammeR", "htmlwidgets")
          install.packages(pkgs, dependencies = TRUE)

          cat("Installed packages:\n")
          print(pkgs)

          if (!requireNamespace("rmarkdown", quietly = TRUE)) {
            stop("rmarkdown failed to install")
          }
          RS

      - name: Check rmarkdown install
        run: |
          Rscript - <<'RS'
          cat("Library paths:\n")
          print(.libPaths())

          cat("rmarkdown installed?\n")
          print(requireNamespace("rmarkdown", quietly = TRUE))

          if (!requireNamespace("rmarkdown", quietly = TRUE)) {
            stop("rmarkdown is still not installed")
          }

          cat("rmarkdown version:\n")
          print(packageVersion("rmarkdown"))
          RS

      - name: Show app files for debugging
        shell: bash
        run: |
          echo "Working directory: $(pwd)"
          find app -maxdepth 4 -type f | sort

      - name: Render Rmarkdown file
        run: |
          Rscript -e 'rmarkdown::render(input = "scripts/DataCleaning.Rmd")'

      - name: Commit and push results
        shell: bash
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"

          git add app/www/DataCleaning.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Report updated"
          git push origin HEAD:staging
