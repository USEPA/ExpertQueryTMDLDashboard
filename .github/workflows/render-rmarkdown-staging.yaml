name: render-rmarkdown-staging

on:
  push:
    branches:
      - staging
  workflow_run:
    workflows: ["import data staging"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-rmarkdown:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install packages
        run: |
          Rscript - <<'RS'
          install.packages(c(
            "knitr",
            "dplyr",
            "DiagrammeR",
            "htmlwidgets",
            "rmarkdown"
          ), repos = "https://cloud.r-project.org")
          RS

      - name: Show launcher files for debugging
        shell: bash
        run: |
          find launcher -maxdepth 3 -type f | sort

      - name: Render Rmarkdown file
        run: |
          Rscript -e 'rmarkdown::render(input = "launcher/scripts/DataCleaning.Rmd")'

      - name: Commit and push results
        shell: bash
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add launcher/www/DataCleaning.html
          git commit -m "Report updated" || echo "No changes to commit"
          git push origin HEAD:${GITHUB_REF_NAME} || echo "No changes to commit"