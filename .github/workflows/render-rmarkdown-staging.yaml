name: render-rmarkdown-staging

on:
  push:
    branches:
      - staging
  workflow_run:
    workflows: ["import data staging"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-rmarkdown:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install R packages
        run: |
          Rscript - <<'RS'
          repos <- "https://cloud.r-project.org"
          pkgs <- c("rmarkdown", "knitr", "dplyr", "DiagrammeR", "htmlwidgets")
          missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing)) install.packages(missing, repos = repos)
          message("Available packages: ", paste(pkgs, collapse = ", "))
          RS

      - name: Verify rmarkdown installation
        run: |
          Rscript -e 'stopifnot(requireNamespace("rmarkdown", quietly = TRUE)); print(packageVersion("rmarkdown"))'

      - name: Show launcher files for debugging
        shell: bash
        run: |
          echo "Working directory: $(pwd)"
          find launcher -maxdepth 4 -type f | sort

      - name: Render Rmarkdown file
        run: |
          Rscript -e 'rmarkdown::render(input = "launcher/scripts/DataCleaning.Rmd")'

      - name: Commit and push results
        shell: bash
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"

          git add launcher/www/DataCleaning.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Report updated"
          git push origin HEAD:staging