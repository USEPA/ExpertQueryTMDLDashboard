name: render-rmarkdown-staging

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["import data staging"]
    types:
      - completed

permissions:
  contents: write

jobs:
  render-rmarkdown:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            pkg-config \
            pandoc

      - name: Install R packages
        run: |
          Rscript - <<'RS'
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))

          pkgs <- c("rmarkdown", "knitr", "dplyr", "DiagrammeR", "htmlwidgets")
          install.packages(pkgs, dependencies = TRUE)

          if (!requireNamespace("rmarkdown", quietly = TRUE)) {
            stop("rmarkdown failed to install")
          }
          RS

      - name: Verify RMD data file
        run: |
          ls -lh app/data || true
          test -f app/data/RMD_data.RData || (echo "Missing app/data/RMD_data.RData" && exit 1)

      - name: Show app files for debugging
        shell: bash
        run: |
          echo "Working directory: $(pwd)"
          find app -maxdepth 4 -type f | sort

      - name: Debug RMD data file before render
        run: |
          pwd
          ls -lah
          ls -lah app || true
          ls -lah app/data || true
          find app/data -maxdepth 1 -type f | sort || true
          Rscript - <<'RS'
          f <- "app/data/RMD_data.RData"
          cat("exists:", file.exists(f), "\n")
          if (file.exists(f)) {
            cat("size:", file.info(f)$size, "\n")
            cat("can read:", file.access(f, 4) == 0, "\n")
          }
          RS

      - name: Render Rmarkdown file
        run: |
          Rscript -e 'rmarkdown::render(input = "scripts/DataCleaning.Rmd")'

      - name: Commit and push results
        shell: bash
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"

          git add app/www/DataCleaning.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Report updated"
          git push origin HEAD:staging
